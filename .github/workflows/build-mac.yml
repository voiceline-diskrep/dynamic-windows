name: Build macOS Apple Silicon

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Package Dynamic Windows for Apple Silicon
        run: |
          npx @electron/packager . "Dynamic Windows" \
            --platform=darwin \
            --arch=arm64 \
            --out=dist \
            --overwrite \
            --app-bundle-id=com.voiceline.dynamicwindows \
            --extend-info='{"LSUIElement": "1"}'
          cd dist
          mv "Dynamic Windows-darwin-arm64" "Dynamic Windows"
          zip -r -y "DynamicWindows-macOS-arm64.zip" "Dynamic Windows"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicWindows-macOS-arm64
          path: dist/DynamicWindows-macOS-arm64.zip

      - name: Attach Mac Bundle to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DynamicWindows-macOS-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
