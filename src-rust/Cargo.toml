[package]
name = "dynamic-windows"
version = "2.1.3"
edition = "2021"
description = "Dynamic Windows - Native Rust Apple Dynamic Island & Notch overlay"

[dependencies]
tao = "0.32"
wry = "0.50"
tray-icon = "0.20"
global-hotkey = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
base64 = "0.22"
ureq = { version = "2", features = ["json"] }
regex = "1"
png = "0.17"
windows-core = "0.58"
windows = { version = "0.58", features = [
    "implement",
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "UI_Notifications",
    "UI_Notifications_Management",
    "ApplicationModel",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_ProcessStatus",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
