<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Windows Island</title>
  <style>
    @font-face {
      font-family: 'Theater';
      src: url('assets/fonts/Theaterv04_Bold.ttf') format('truetype'),
           local('Theater'),
           local('Theaterv04_Bold');
      font-weight: normal;
      font-style: normal;
    }
    :root {
      --app-font-family: 'Theater', 'Segoe UI Variable Text', -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      font-family: var(--app-font-family);
    }
    #canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #inline-modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9998;
      background: transparent;
      pointer-events: auto;
    }
    #inline-modal {
      display: none;
      position: absolute;
      top: 44px;
      left: 50%;
      transform: translateX(-50%);
      width: 400px;
      padding: 16px;
      background: rgba(16, 16, 20, 0.96);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.65);
      z-index: 9999;
      color: #ffffff;
      pointer-events: auto;
    }
    #inline-modal-title {
      font-size: 13px;
      font-weight: 600;
      color: #e4e4e7;
      margin-bottom: 10px;
    }
    #inline-modal-input,
    #inline-modal-desc {
      width: 100%;
      padding: 8px 12px;
      font-size: 12px;
      font-family: inherit;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      color: #ffffff;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    #inline-modal-desc {
      display: none;
      margin-top: 8px;
      min-height: 52px;
      max-height: 84px;
      resize: none;
      line-height: 1.4;
    }
    #inline-modal-input:focus,
    #inline-modal-desc:focus {
      background: rgba(255, 255, 255, 0.10);
      border-color: rgba(255, 255, 255, 0.36);
    }
    .modal-input-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .modal-input-row #inline-modal-input {
      flex: 1;
    }
    #inline-modal-mic-btn {
      display: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      color: #d4d4d8;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    #inline-modal-mic-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
    }
    #inline-modal-mic-btn.listening {
      background: rgba(255, 69, 58, 0.24);
      border-color: rgba(255, 69, 58, 0.65);
      color: #ff6961;
    }
    #inline-modal-mic-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .modal-section-label {
      font-size: 10px;
      font-weight: 500;
      color: #94a3b8;
      margin-top: 10px;
      margin-bottom: 6px;
    }
    #inline-modal-extra,
    #inline-modal-categories,
    #inline-modal-colors {
      display: none;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }
    #inline-modal-extra {
      margin-top: 10px;
    }
    .modal-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10.5px;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.10);
      color: #cbd5e1;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .modal-chip svg {
      width: 11px;
      height: 11px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
    .modal-chip.active {
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.38);
      color: #ffffff;
      font-weight: 600;
    }
    .modal-cat-add-input {
      width: 96px;
      padding: 3px 8px;
      font-size: 10.5px;
      font-family: inherit;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 6px;
      color: #ffffff;
      outline: none;
    }
    .modal-swatch {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.12s, border-color 0.12s;
    }
    .modal-swatch:hover {
      transform: scale(1.08);
    }
    .modal-swatch.active {
      border-color: #ffffff;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.35);
    }
    .modal-color-custom {
      width: 24px;
      height: 20px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
    }
    .modal-btn {
      padding: 6px 14px;
      font-size: 11.5px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      transition: background 0.15s, color 0.15s;
    }
    .modal-btn-cancel {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
    }
    .modal-btn-cancel:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
    }
    .modal-btn-submit {
      background: #f4f4f5;
      color: #09090b;
    }
    .modal-btn-submit:hover {
      background: #ffffff;
    }

    /* ================================================================ */
    /* Embedded Apple Notes / Google-Docs Rich-Text Editor (Right 2/3)  */
    /* ================================================================ */
    #notes-doc-pane {
      display: none;
      position: fixed;
      z-index: 40;
      flex-direction: column;
      background: rgba(24, 24, 28, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 10px;
      overflow: hidden;
      pointer-events: auto;
      user-select: text;
      color: #f4f4f5;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    #notes-doc-toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 3px;
      padding: 5px 7px;
      background: rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }
    .doc-select {
      height: 20px;
      padding: 0 4px;
      font-size: 9.5px;
      font-family: inherit;
      font-weight: 500;
      color: #e4e4e7;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 5px;
      outline: none;
      cursor: pointer;
    }
    .doc-select option {
      background: #18181c;
      color: #f4f4f5;
    }
    .doc-sep {
      width: 1px;
      height: 14px;
      background: rgba(255, 255, 255, 0.10);
      margin: 0 2px;
    }
    .doc-tool-btn {
      width: 21px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      border-radius: 5px;
      background: transparent;
      color: #d4d4d8;
      font-size: 10.5px;
      font-weight: 700;
      font-family: Georgia, serif;
      cursor: pointer;
      padding: 0;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    .doc-tool-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }
    .doc-tool-btn.active {
      background: rgba(245, 185, 66, 0.22);
      border-color: rgba(245, 185, 66, 0.45);
      color: #fde68a;
    }
    .doc-tool-btn svg {
      width: 12px;
      height: 12px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .doc-voice-group {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    #doc-voice-btn {
      width: 22px;
      height: 20px;
      border-radius: 5px;
      border: 1px solid rgba(245, 185, 66, 0.28);
      background: rgba(245, 185, 66, 0.12);
      color: #f5b942;
    }
    #doc-voice-btn:hover {
      background: rgba(245, 185, 66, 0.24);
      color: #fef08a;
    }
    #doc-voice-btn.listening {
      background: rgba(255, 69, 58, 0.28);
      border-color: rgba(255, 69, 58, 0.72);
      color: #ff6961;
      animation: docMicPulse 1.1s ease-in-out infinite;
    }
    @keyframes docMicPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 69, 58, 0.42); }
      50% { box-shadow: 0 0 0 4px rgba(255, 69, 58, 0.0); }
    }
    #notes-doc-editor-wrap {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      padding: 8px 11px 6px 11px;
      overflow-y: auto;
    }
    #notes-doc-editor-wrap::-webkit-scrollbar {
      width: 4px;
    }
    #notes-doc-editor-wrap::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);
      border-radius: 2px;
    }
    #notes-doc-title {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      margin-bottom: 5px;
      padding: 0;
    }
    #notes-doc-title::placeholder {
      color: rgba(255, 255, 255, 0.28);
    }
    #notes-doc-body {
      flex: 1;
      min-height: 110px;
      outline: none;
      color: #e4e4e7;
      font-size: 12.5px;
      line-height: 1.5;
      word-break: break-word;
    }
    #notes-doc-body:empty::before {
      content: attr(data-placeholder);
      color: rgba(255, 255, 255, 0.28);
      pointer-events: none;
    }
    #notes-doc-body h1 {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      margin: 4px 0 3px;
    }
    #notes-doc-body h2 {
      font-size: 14.5px;
      font-weight: 700;
      color: #f4f4f5;
      margin: 3px 0 2px;
    }
    #notes-doc-body h3 {
      font-size: 12.5px;
      font-weight: 600;
      color: #a1a1aa;
      margin: 2px 0;
    }
    #notes-doc-body ul {
      padding-left: 18px;
      margin: 3px 0;
    }
    #notes-doc-body li {
      margin: 1px 0;
    }
    .doc-check-item {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      margin: 2px 0;
    }
    .doc-check-item input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      margin-top: 3px;
      border-radius: 4px;
      border: 1.4px solid rgba(245, 185, 66, 0.65);
      background: rgba(255, 255, 255, 0.04);
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
      transition: background 0.14s, border-color 0.14s;
    }
    .doc-check-item input[type="checkbox"]:checked {
      background: #f5b942;
      border-color: #f5b942;
    }
    .doc-check-item input[type="checkbox"]:checked::after {
      content: "";
      position: absolute;
      left: 3.5px;
      top: 1px;
      width: 3.5px;
      height: 7px;
      border: solid #121216;
      border-width: 0 1.8px 1.8px 0;
      transform: rotate(42deg);
    }
    .doc-check-text {
      flex: 1;
      outline: none;
      transition: color 0.14s, opacity 0.14s;
    }
    .doc-check-item.checked .doc-check-text {
      text-decoration: line-through;
      color: #71717a;
      opacity: 0.72;
    }
    #notes-voice-bar {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      font-size: 10px;
      background: rgba(255, 69, 58, 0.14);
      border-top: 1px solid rgba(255, 69, 58, 0.28);
      color: #fca5a5;
      flex-shrink: 0;
    }
    #notes-voice-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ff453a;
      flex-shrink: 0;
    }
    #notes-voice-status {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #notes-doc-empty {
      display: none;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px;
      text-align: center;
      color: #71717a;
      font-size: 11px;
    }
    #notes-doc-empty-btn {
      padding: 5px 12px;
      border-radius: 7px;
      border: 1px solid rgba(245, 185, 66, 0.38);
      background: rgba(245, 185, 66, 0.14);
      color: #fde68a;
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
    }
    #notes-doc-empty-btn:hover {
      background: rgba(245, 185, 66, 0.26);
      color: #ffffff;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <!-- Embedded Rich-Text Notes Editor (Right 2/3 of Notes View) -->
  <div id="notes-doc-pane">
    <div id="notes-doc-toolbar">
      <select id="doc-font" class="doc-select" title="Font">
        <option value="Sans">Sans</option>
        <option value="Theater">Theater</option>
        <option value="Serif">Serif</option>
        <option value="Mono">Mono</option>
        <option value="Rounded">Rounded</option>
      </select>
      <select id="doc-size" class="doc-select" title="Size">
        <option value="11">11</option>
        <option value="12">12</option>
        <option value="13" selected>13</option>
        <option value="15">15</option>
        <option value="18">18</option>
        <option value="22">22</option>
      </select>
      <select id="doc-block" class="doc-select" title="Heading / Style">
        <option value="p">Body</option>
        <option value="h1">Title</option>
        <option value="h2">Heading</option>
        <option value="h3">Subtitle</option>
      </select>
      <span class="doc-sep"></span>
      <button class="doc-tool-btn" data-cmd="bold" title="Bold">B</button>
      <button class="doc-tool-btn" data-cmd="italic" title="Italic" style="font-style:italic;">I</button>
      <button class="doc-tool-btn" data-cmd="underline" title="Underline" style="text-decoration:underline;">U</button>
      <button class="doc-tool-btn" data-cmd="strikeThrough" title="Crossed Out" style="text-decoration:line-through;">S</button>
      <span class="doc-sep"></span>
      <button class="doc-tool-btn" id="doc-bullet-btn" title="Bullet Points">
        <svg viewBox="0 0 16 16"><circle cx="3" cy="4.5" r="1" fill="currentColor" stroke="none"/><line x1="6" y1="4.5" x2="13.5" y2="4.5"/><circle cx="3" cy="8.5" r="1" fill="currentColor" stroke="none"/><line x1="6" y1="8.5" x2="13.5" y2="8.5"/><circle cx="3" cy="12.5" r="1" fill="currentColor" stroke="none"/><line x1="6" y1="12.5" x2="13.5" y2="12.5"/></svg>
      </button>
      <button class="doc-tool-btn" id="doc-checklist-btn" title="Checklist">
        <svg viewBox="0 0 16 16"><rect x="2" y="2.5" width="4" height="4" rx="1"/><path d="M3 4.5l0.9 0.9 1.6-1.8"/><line x1="8" y1="4.5" x2="14" y2="4.5"/><rect x="2" y="9.5" width="4" height="4" rx="1"/><line x1="8" y1="11.5" x2="14" y2="11.5"/></svg>
      </button>
      <div class="doc-voice-group">
        <select id="doc-voice-lang" class="doc-select" title="Voice Language">
          <option value="en-US">EN</option>
          <option value="id-ID">ID</option>
          <option value="zh-CN">ZH</option>
          <option value="de-DE">DE</option>
          <option value="es-ES">ES</option>
        </select>
        <button class="doc-tool-btn" id="doc-voice-btn" title="Voice Dictation">
          <svg viewBox="0 0 16 16"><rect x="5.8" y="2" width="4.4" height="7" rx="2.2"/><path d="M3.5 7.5a4.5 4.5 0 0 0 9 0"/><line x1="8" y1="12" x2="8" y2="14.5"/><line x1="5.5" y1="14.5" x2="10.5" y2="14.5"/></svg>
        </button>
      </div>
    </div>
    <div id="notes-doc-editor-wrap">
      <input id="notes-doc-title" type="text" placeholder="Title" />
      <div id="notes-doc-body" contenteditable="true" data-placeholder="Start writing or tap the mic to dictate..."></div>
    </div>
    <div id="notes-doc-empty">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="rgba(245,185,66,0.75)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
      <div>Select a note or create a new document</div>
      <button id="notes-doc-empty-btn">New Note</button>
    </div>
    <div id="notes-voice-bar">
      <span id="notes-voice-dot"></span>
      <span id="notes-voice-status">Listening...</span>
    </div>
  </div>

  <div id="inline-modal-backdrop"></div>
  <div id="inline-modal">
    <div id="inline-modal-title">Add Note</div>
    <div class="modal-input-row">
      <input id="inline-modal-input" type="text" placeholder="Enter details..." />
      <button id="inline-modal-mic-btn" type="button" title="Voice Input">
        <svg viewBox="0 0 16 16"><rect x="5.8" y="2" width="4.4" height="7" rx="2.2"/><path d="M3.5 7.5a4.5 4.5 0 0 0 9 0"/><line x1="8" y1="12" x2="8" y2="14.5"/><line x1="5.5" y1="14.5" x2="10.5" y2="14.5"/></svg>
      </button>
    </div>
    <textarea id="inline-modal-desc" placeholder="Description (optional)"></textarea>
    <div id="inline-modal-extra"></div>
    <div id="inline-modal-cat-label" class="modal-section-label" style="display:none;">Category</div>
    <div id="inline-modal-categories"></div>
    <div id="inline-modal-color-label" class="modal-section-label" style="display:none;">Date Color</div>
    <div id="inline-modal-colors"></div>
    <div class="modal-actions">
      <button class="modal-btn modal-btn-cancel" id="inline-modal-cancel">Cancel</button>
      <button class="modal-btn modal-btn-submit" id="inline-modal-submit">Add</button>
    </div>
  </div>
  <script src="rust-bridge.js"></script>
  <script src="canvas-engine.js"></script>
</body>
</html>
