<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Windows Island</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      font-family: 'Segoe UI Variable Display', 'Segoe UI', Inter, -apple-system, sans-serif;
    }
    #canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #inline-modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9998;
      background: transparent;
      pointer-events: auto;
    }
    #inline-modal {
      display: none;
      position: absolute;
      top: 54px;
      left: 50%;
      transform: translateX(-50%);
      width: 380px;
      padding: 16px;
      background: rgba(18, 18, 22, 0.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 14px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.08);
      z-index: 9999;
      color: #ffffff;
      pointer-events: auto;
    }
    #inline-modal-title {
      font-size: 13px;
      font-weight: 600;
      color: #e4e4e7;
      margin-bottom: 10px;
    }
    #inline-modal-input {
      width: 100%;
      padding: 9px 12px;
      font-size: 12.5px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      color: #ffffff;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    #inline-modal-input:focus {
      background: rgba(255, 255, 255, 0.12);
      border-color: #38bdf8;
    }
    #inline-modal-extra {
      display: none;
      margin-top: 10px;
      gap: 6px;
      flex-wrap: wrap;
    }
    .modal-chip {
      font-size: 10px;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      cursor: pointer;
    }
    .modal-chip.active {
      background: #2563eb;
      border-color: #3b82f6;
      color: #ffffff;
      font-weight: 600;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }
    .modal-btn {
      padding: 6px 14px;
      font-size: 11.5px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }
    .modal-btn-cancel {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
    }
    .modal-btn-cancel:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
    }
    .modal-btn-submit {
      background: #2563eb;
      color: #ffffff;
    }
    .modal-btn-submit:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="inline-modal-backdrop"></div>
  <div id="inline-modal">
    <div id="inline-modal-title">Add Note</div>
    <input id="inline-modal-input" type="text" placeholder="Enter details..." />
    <div id="inline-modal-extra"></div>
    <div class="modal-actions">
      <button class="modal-btn modal-btn-cancel" id="inline-modal-cancel">Cancel</button>
      <button class="modal-btn modal-btn-submit" id="inline-modal-submit">Add</button>
    </div>
  </div>
  <script src="ipc-adapter.js"></script>
  <script src="canvas-engine.js"></script>
</body>
</html>
