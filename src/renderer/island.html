<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Windows Island</title>
  <style>
    @font-face {
      font-family: 'Theater';
      src: url('assets/fonts/Theaterv04_Bold.ttf') format('truetype'),
           local('Theater'),
           local('Theaterv04_Bold');
      font-weight: normal;
      font-style: normal;
    }
    :root {
      --app-font-family: 'Theater', 'Segoe UI Variable Text', -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      font-family: var(--app-font-family);
    }
    #canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #inline-modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9998;
      background: transparent;
      pointer-events: auto;
    }
    #inline-modal {
      display: none;
      position: absolute;
      top: 44px;
      left: 50%;
      transform: translateX(-50%);
      width: 400px;
      padding: 16px;
      background: rgba(16, 16, 20, 0.96);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.65);
      z-index: 9999;
      color: #ffffff;
      pointer-events: auto;
    }
    #inline-modal-title {
      font-size: 13px;
      font-weight: 600;
      color: #e4e4e7;
      margin-bottom: 10px;
    }
    #inline-modal-input,
    #inline-modal-desc {
      width: 100%;
      padding: 8px 12px;
      font-size: 12px;
      font-family: inherit;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      color: #ffffff;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    #inline-modal-desc {
      display: none;
      margin-top: 8px;
      min-height: 52px;
      max-height: 84px;
      resize: none;
      line-height: 1.4;
    }
    #inline-modal-input:focus,
    #inline-modal-desc:focus {
      background: rgba(255, 255, 255, 0.10);
      border-color: #3b82f6;
    }
    .modal-section-label {
      font-size: 10px;
      font-weight: 500;
      color: #94a3b8;
      margin-top: 10px;
      margin-bottom: 6px;
    }
    #inline-modal-extra,
    #inline-modal-categories,
    #inline-modal-colors {
      display: none;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }
    #inline-modal-extra {
      margin-top: 10px;
    }
    .modal-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10.5px;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.10);
      color: #cbd5e1;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .modal-chip svg {
      width: 11px;
      height: 11px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
    .modal-chip.active {
      background: #2563eb;
      border-color: #3b82f6;
      color: #ffffff;
      font-weight: 600;
    }
    .modal-cat-add-input {
      width: 96px;
      padding: 3px 8px;
      font-size: 10.5px;
      font-family: inherit;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(59, 130, 246, 0.5);
      border-radius: 6px;
      color: #ffffff;
      outline: none;
    }
    .modal-swatch {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.12s, border-color 0.12s;
    }
    .modal-swatch:hover {
      transform: scale(1.08);
    }
    .modal-swatch.active {
      border-color: #ffffff;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.35);
    }
    .modal-color-custom {
      width: 24px;
      height: 20px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
    }
    .modal-btn {
      padding: 6px 14px;
      font-size: 11.5px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      transition: background 0.15s, color 0.15s;
    }
    .modal-btn-cancel {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
    }
    .modal-btn-cancel:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
    }
    .modal-btn-submit {
      background: #2563eb;
      color: #ffffff;
    }
    .modal-btn-submit:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="inline-modal-backdrop"></div>
  <div id="inline-modal">
    <div id="inline-modal-title">Add Note</div>
    <input id="inline-modal-input" type="text" placeholder="Enter details..." />
    <textarea id="inline-modal-desc" placeholder="Description (optional)"></textarea>
    <div id="inline-modal-extra"></div>
    <div id="inline-modal-cat-label" class="modal-section-label" style="display:none;">Category</div>
    <div id="inline-modal-categories"></div>
    <div id="inline-modal-color-label" class="modal-section-label" style="display:none;">Date Color</div>
    <div id="inline-modal-colors"></div>
    <div class="modal-actions">
      <button class="modal-btn modal-btn-cancel" id="inline-modal-cancel">Cancel</button>
      <button class="modal-btn modal-btn-submit" id="inline-modal-submit">Add</button>
    </div>
  </div>
  <script src="rust-bridge.js"></script>
  <script src="canvas-engine.js"></script>
</body>
</html>
