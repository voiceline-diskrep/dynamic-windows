<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Windows Island</title>
  <style>
    @font-face {
      font-family: 'Theater';
      src: url('assets/fonts/Theaterv04_Bold.ttf') format('truetype'),
           local('Theater'),
           local('Theaterv04_Bold');
      font-weight: normal;
      font-style: normal;
    }
    :root {
      --app-font-family: 'Theater', 'Segoe UI Variable Text', -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      font-family: var(--app-font-family);
    }
    #canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #inline-modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9998;
      background: transparent;
      pointer-events: auto;
    }
    #inline-modal {
      display: none;
      position: absolute;
      top: 54px;
      left: 50%;
      transform: translateX(-50%);
      width: 380px;
      padding: 16px;
      background: rgba(18, 18, 22, 0.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 14px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.08);
      z-index: 9999;
      color: #ffffff;
      pointer-events: auto;
    }
    #inline-modal-title {
      font-size: 13px;
      font-weight: 600;
      color: #e4e4e7;
      margin-bottom: 10px;
    }
    #inline-modal-input {
      width: 100%;
      padding: 9px 12px;
      font-size: 12.5px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      color: #ffffff;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    #inline-modal-input:focus {
      background: rgba(255, 255, 255, 0.12);
      border-color: #38bdf8;
    }
    #inline-modal-extra {
      display: none;
      margin-top: 10px;
      gap: 6px;
      flex-wrap: wrap;
    }
    .modal-chip {
      font-size: 10px;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      cursor: pointer;
    }
    .modal-chip.active {
      background: #2563eb;
      border-color: #3b82f6;
      color: #ffffff;
      font-weight: 600;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }
    .modal-btn {
      padding: 6px 14px;
      font-size: 11.5px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }
    .modal-btn-cancel {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
    }
    .modal-btn-cancel:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
    }
    .modal-btn-submit {
      background: #2563eb;
      color: #ffffff;
    }
    .modal-btn-submit:hover {
      background: #1d4ed8;
    }

    /* AI Chat Overlay Container */
    #ai-chat-overlay {
      display: none;
      position: absolute;
      top: 36px;
      left: 50%;
      transform: translateX(-50%);
      width: 636px;
      height: 432px;
      z-index: 500;
      pointer-events: auto;
      flex-direction: column;
      color: #f4f4f5;
      font-family: var(--app-font-family);
    }
    #ai-chat-overlay.active {
      display: flex;
    }
    .ai-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 32px;
      padding: 0 4px;
      margin-bottom: 8px;
      flex-shrink: 0;
    }
    .ai-btn-screen {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 8px;
      color: #38bdf8;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }
    .ai-btn-screen:hover {
      background: rgba(56, 189, 248, 0.25);
      border-color: #38bdf8;
      transform: scale(1.02);
    }
    .ai-mode-toggle {
      display: none;
      align-items: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }
    .ai-mode-btn {
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #a1a1aa;
      cursor: pointer;
      border: none;
      background: transparent;
      transition: all 0.15s;
    }
    .ai-mode-btn.active {
      background: #2563eb;
      color: #ffffff;
    }
    .ai-session-bar {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ai-session-select {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 7px;
      color: #e4e4e7;
      font-size: 11.5px;
      padding: 4px 10px;
      outline: none;
      max-width: 170px;
      cursor: pointer;
    }
    .ai-session-select option {
      background: #18181b;
      color: #ffffff;
    }
    .ai-btn-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 7px;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .ai-btn-icon:hover {
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
    }

    /* Messages Thread */
    .ai-messages-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px 6px 8px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .ai-messages-container::-webkit-scrollbar {
      width: 5px;
    }
    .ai-messages-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 3px;
    }
    .ai-messages-container::-webkit-scrollbar-track {
      background: transparent;
    }

    /* Empty state */
    .ai-empty-state {
      margin: auto;
      text-align: center;
      padding: 20px;
      max-width: 420px;
    }
    .ai-empty-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }
    .ai-empty-title {
      font-size: 14px;
      font-weight: 700;
      color: #f4f4f5;
      margin-bottom: 4px;
    }
    .ai-empty-desc {
      font-size: 11.5px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 14px;
    }
    .ai-empty-chips {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .ai-chip {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      color: #cbd5e1;
      cursor: pointer;
      transition: all 0.15s;
    }
    .ai-chip:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: #38bdf8;
      color: #38bdf8;
    }

    /* Message Bubbles */
    .ai-msg {
      display: flex;
      flex-direction: column;
      max-width: 86%;
      animation: aiFadeIn 0.18s ease;
    }
    @keyframes aiFadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .ai-msg.user {
      align-self: flex-end;
      align-items: flex-end;
    }
    .ai-msg.assistant {
      align-self: flex-start;
      align-items: flex-start;
    }
    .ai-bubble {
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12.5px;
      line-height: 1.5;
      word-break: break-word;
      user-select: text;
    }
    .ai-msg.user .ai-bubble {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      border-bottom-right-radius: 3px;
    }
    .ai-msg.assistant .ai-bubble {
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #f4f4f5;
      border-bottom-left-radius: 3px;
    }
    .ai-msg.error .ai-bubble {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }
    .ai-msg-time {
      font-size: 9.5px;
      color: #71717a;
      margin-top: 3px;
      padding: 0 4px;
    }
    .ai-msg-images {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }
    .ai-msg-thumb {
      max-width: 180px;
      max-height: 120px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      object-fit: cover;
    }
    .ai-bubble pre {
      background: rgba(0, 0, 0, 0.45);
      padding: 8px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 6px 0;
      font-family: Consolas, monospace;
      font-size: 11.5px;
    }
    .ai-bubble code {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 4px;
      border-radius: 4px;
      font-family: Consolas, monospace;
      font-size: 11px;
    }

    /* Typing indicator */
    .ai-typing-indicator {
      display: none;
      align-items: center;
      gap: 4px;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      width: fit-content;
      margin-top: 4px;
    }
    .ai-typing-dot {
      width: 5px;
      height: 5px;
      background: #38bdf8;
      border-radius: 50%;
      animation: aiBounce 1.2s infinite ease-in-out;
    }
    .ai-typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .ai-typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes aiBounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1.0); opacity: 1; }
    }

    /* Input Tray & Box */
    .ai-input-wrapper {
      flex-shrink: 0;
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .ai-attachments-tray {
      display: none;
      gap: 6px;
      flex-wrap: wrap;
      padding: 4px 6px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .ai-attach-item {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 3px 6px;
      font-size: 11px;
    }
    .ai-attach-thumb {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      object-fit: cover;
    }
    .ai-attach-remove {
      cursor: pointer;
      color: #ef4444;
      font-weight: bold;
      margin-left: 4px;
    }
    .ai-input-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.065);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 6px 10px;
      transition: border-color 0.15s, background 0.15s;
    }
    .ai-input-bar:focus-within {
      background: rgba(255, 255, 255, 0.1);
      border-color: #38bdf8;
    }
    .ai-chat-textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 12.5px;
      font-family: var(--app-font-family);
      resize: none;
      max-height: 80px;
      line-height: 1.4;
      user-select: text;
    }
    .ai-chat-textarea::placeholder {
      color: #71717a;
    }
    .ai-btn-send {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #2563eb;
      border: none;
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .ai-btn-send:hover {
      background: #3b82f6;
      transform: scale(1.05);
    }
    .ai-btn-send:disabled {
      background: rgba(255, 255, 255, 0.1);
      color: #71717a;
      cursor: not-allowed;
      transform: none;
    }
    .ai-btn-attach {
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      transition: color 0.15s;
    }
    .ai-btn-attach:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="inline-modal-backdrop"></div>
  <div id="inline-modal">
    <div id="inline-modal-title">Add Note</div>
    <input id="inline-modal-input" type="text" placeholder="Enter details..." />
    <div id="inline-modal-extra"></div>
    <div class="modal-actions">
      <button class="modal-btn modal-btn-cancel" id="inline-modal-cancel">Cancel</button>
      <button class="modal-btn modal-btn-submit" id="inline-modal-submit">Add</button>
    </div>
  </div>

  <!-- AI Companion & Chat Overlay -->
  <div id="ai-chat-overlay">
    <div class="ai-header-bar">
      <button class="ai-btn-screen" id="btn-ai-analyze-screen" title="Instant Screen Screenshot Analysis">
        <span>📸</span>
        <span>Analyze Screen</span>
      </button>

      <div class="ai-mode-toggle" id="ai-mode-toggle-bar">
        <button class="ai-mode-btn" id="btn-ai-mode-monitor">✦ Monitor</button>
        <button class="ai-mode-btn active" id="btn-ai-mode-chat">💬 Chat</button>
      </div>

      <div class="ai-session-bar">
        <select class="ai-session-select" id="ai-session-select" title="Switch Chat Session"></select>
        <button class="ai-btn-icon" id="btn-ai-new-chat" title="New Chat Session">+</button>
        <button class="ai-btn-icon" id="btn-ai-delete-chat" title="Delete Active Session">🗑</button>
      </div>
    </div>

    <div class="ai-messages-container" id="ai-messages-list">
      <div class="ai-empty-state" id="ai-empty-state">
        <div class="ai-empty-icon">✨</div>
        <div class="ai-empty-title">Dynamic Windows AI</div>
        <div class="ai-empty-desc">Connected via Gemini & Multimodal Vision. Ask anything, drag files, paste screenshots, or click 'Analyze Screen' above.</div>
        <div class="ai-empty-chips">
          <div class="ai-chip" data-prompt="Analyze what is on my screen right now and summarize active tasks.">📸 Analyze Screen</div>
          <div class="ai-chip" data-prompt="How can I optimize my workflow today?">⚡ Workflow Tips</div>
          <div class="ai-chip" data-prompt="Explain this project and key shortcuts.">💡 Dynamic Windows Help</div>
        </div>
      </div>
      <div class="ai-typing-indicator" id="ai-typing-indicator">
        <div class="ai-typing-dot"></div>
        <div class="ai-typing-dot"></div>
        <div class="ai-typing-dot"></div>
      </div>
    </div>

    <div class="ai-input-wrapper">
      <div class="ai-attachments-tray" id="ai-attachments-tray"></div>
      <div class="ai-input-bar">
        <input type="file" id="ai-file-picker" style="display: none;" accept="image/*,.txt,.md,.json,.js,.py,.html,.css" multiple />
        <button class="ai-btn-attach" id="btn-ai-attach" title="Attach file or image">📎</button>
        <textarea class="ai-chat-textarea" id="ai-chat-textarea" rows="1" placeholder="Ask AI, paste image (Ctrl+V), or drag files here..."></textarea>
        <button class="ai-btn-send" id="btn-ai-send" title="Send Message">➤</button>
      </div>
    </div>
  </div>
  <script src="canvas-engine.js"></script>
</body>
</html>
